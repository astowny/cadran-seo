# Two containers per site: `cadran-seo` serves the static pages and proxies
# /api/, `api` runs the Bun checkout/webhook service.
#
# The compose SERVICE name of the second container is `api` in BOTH repos, so
# that nginx.conf stays byte-identical across them (it proxies to the DNS name
# `api`). The container_name stays globally unique because every container on
# this host shares one namespace.
services:
  cadran-seo:
    build:
      context: .
    image: cadran-seo:latest
    container_name: cadran-seo
    restart: unless-stopped
    networks:
      - dokploy-network
      - site
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.cadran-seo-web.rule=Host(`cadran-seo.devanchor.company`)
      - traefik.http.routers.cadran-seo-web.entrypoints=web
      - traefik.http.routers.cadran-seo-web.middlewares=redirect-to-https@file
      - traefik.http.routers.cadran-seo-web.service=cadran-seo
      - traefik.http.routers.cadran-seo-secure.rule=Host(`cadran-seo.devanchor.company`)
      - traefik.http.routers.cadran-seo-secure.entrypoints=websecure
      - traefik.http.routers.cadran-seo-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.cadran-seo-secure.service=cadran-seo
      - traefik.http.routers.cadran-seo-secure.middlewares=cadran-seo-auth
      # The whole site is behind a shared password. The credential pair lives in
      # BASIC_AUTH_USERS on the Dokploy app, never in this repository -- it is
      # public, and a bcrypt hash in a public tree is an offline cracking target.
      - traefik.http.middlewares.cadran-seo-auth.basicauth.users=${BASIC_AUTH_USERS}
      # Two paths CANNOT authenticate and must bypass the gate, or closing the
      # door breaks them silently:
      #   /api/stripe-webhook  Stripe holds no password. Behind basicauth every
      #                        delivery 401s and no purchase notification is ever
      #                        sent. It is not left unprotected: the handler
      #                        verifies Stripe's HMAC signature, which is a
      #                        stronger check than a shared password.
      #   /api/healthz         the uptime probe would report the api permanently
      #                        down. It returns "ok" and nothing else.
      # Higher priority than the catch-all router, set explicitly rather than
      # relying on Traefik's rule-length ordering.
      - traefik.http.routers.cadran-seo-open.rule=Host(`cadran-seo.devanchor.company`) && (Path(`/api/stripe-webhook`) || Path(`/api/healthz`))
      - traefik.http.routers.cadran-seo-open.entrypoints=websecure
      - traefik.http.routers.cadran-seo-open.tls.certresolver=letsencrypt
      - traefik.http.routers.cadran-seo-open.service=cadran-seo
      - traefik.http.routers.cadran-seo-open.priority=100
      - traefik.http.services.cadran-seo.loadbalancer.server.port=80
    # /etc/docker/daemon.json on this host configures no log rotation and
    # /var/lib/docker/containers is already large, so every service sets its
    # own. Without this a chatty container fills the disk silently.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./api
    image: cadran-seo-api:latest
    container_name: cadran-seo-api
    restart: unless-stopped
    # Only `site`. Never dokploy-network: that network carries 17 containers
    # (verified 31/08/2026, `docker network inspect dokploy-network`), among
    # them two Coder containers that run arbitrary user code, n8n, Nextcloud
    # and the Dokploy control plane. Any of them can resolve `cadran-seo-api`
    # and POST to :3000, bypassing every nginx-level control at once -- the
    # limit_req zone, the body caps, the /api/ path prefix. "No Traefik labels"
    # is a routing property, not an isolation property.
    networks:
      - site
    # No `ports:`. The api is reached only through nginx, which is the only
    # other member of the `site` network.
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true

  # Project-local bridge, created and destroyed with this compose project and
  # joinable only by its two services. It is NOT declared `internal: true`,
  # and that is a deliberate, named departure from the spec's
  # `api-on-a-project-internal-network-only`.
  #
  # Reason, from the Docker documentation for `--internal`: "Containers on an
  # internal network may communicate between each other, but not with any
  # other network, as no default route is configured and firewall rules are
  # set up to drop all traffic to or from other networks." The api's entire
  # job is to call https://api.stripe.com and https://api.resend.com. On an
  # internal-only network it has no route to either: every checkout would fail
  # and no notification would ever be sent.
  #
  # What the spec was actually buying -- isolation from the 17 containers on
  # dokploy-network -- this network already provides, because they are not on
  # it and Docker drops traffic between separate bridges. The one property
  # `internal: true` would add on top is blocking egress, and the same Docker
  # page notes that even then "the host may communicate with any container IP
  # directly", so it does not close the local-host path either.
  #
  # If outbound egress ever has to be denied, the replacement is an allowlisting
  # forward proxy for api.stripe.com and api.resend.com, not this flag.
  site:
    driver: bridge
